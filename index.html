<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Basic Website</title>
    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- PART 1 -->
    <div id="part-one">
        <!-- The Login Button -->
        <button type="button" id="loginButton" class="custom-button" title="Part 1">
            Login
        </button>

        <!-- Say Hi -->
        <button type="button" id="sayHiButton" class="custom-button hidden">
            Say Hi
        </button>

        <!-- Favorite Animal -->
        <button type="button" id="favoriteAnimalButton" class="custom-button hidden">
            Favorite Animal
        </button>
    </div>

    <hr>

    <!-- PART 2 -->
    <div id="part-two">
        <!-- The Login2 Button -->
        <button type="button" id="login_button2" class="custom-button" title="Part 2">
            Login2
        </button>
    </div>

    <hr>

    <!-- EXERCISES -->
    <div id="exercises-fruit">
        <button id="add_fruit">Add Fruit</button>
        <button id="index_fruit">Index Fruit</button>
        <ul id="fruit_list"></ul>
    </div>

    <hr>
    <div id="exercises-numbers">
        <button id="sum_numbers">Sum Numbers</button>
        <button id="splice">Splice Numbers</button>
        <button id="reset_numbers">Reset Numbers</button>
        <ul id="number_list"></ul>
    </div>

    <!-- Link to your JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
